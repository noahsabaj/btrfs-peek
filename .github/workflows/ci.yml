name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release

  roundtrip:
    name: verify against the real kernel driver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release

      # Build an image with the kernel's own btrfs driver, covering every read
      # path, then copy it out with btrfs-peek and compare sha256 per file.
      # This is the test that proves we decode what Linux encoded.
      - name: Build the reference image
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq btrfs-progs
          mkdir -p fixture
          sudo bash tests/mkimg.sh "$PWD/fixture"
          sudo chown "$USER" fixture/test.img fixture/manifest.txt

      - name: Copy it out and compare every file
        run: |
          ./target/release/btrfs-peek -d fixture/test.img cp / out --manifest peek.jsonl
          python3 tests/verify.py fixture/manifest.txt peek.jsonl /

      - name: The verifier must fail on a corrupted copy
        run: |
          printf 'X' | dd of=out/random.bin bs=1 seek=1024 conv=notrunc status=none
          if python3 tests/verify.py fixture/manifest.txt peek.jsonl / ; then
            echo "verify.py passed on a corrupted copy; it is not a real check"
            exit 1
          fi

      # A crafted image must not be able to write outside the destination. The
      # kernel cannot create a name like `../../evil`, so we forge one.
      - name: A path-traversal name stays inside the destination
        run: |
          python3 tests/forge_hostile.py fixture/test.img fixture/hostile.img inline.txt ../../evil
          mkdir -p esc/a/b/dest
          ( cd esc/a/b && "$GITHUB_WORKSPACE/target/release/btrfs-peek"               -d "$GITHUB_WORKSPACE/fixture/hostile.img" cp / dest )
          escaped=$(find esc -name 'evil*' -not -path '*/dest/*')
          if [ -n "$escaped" ]; then
            echo "a crafted entry name escaped the destination: $escaped"
            exit 1
          fi
          test -e esc/a/b/dest/.._.._evil
