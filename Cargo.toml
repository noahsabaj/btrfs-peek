[package]
name = "btrfs-peek"
version = "0.3.1"
edition = "2021"
description = "Read a btrfs filesystem from userspace, read-only, on any OS. No driver, no mount. Built for dual-booters and for agents."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/noahsabaj/btrfs-peek"
homepage = "https://github.com/noahsabaj/btrfs-peek"
authors = ["Noah Sabaj"]
exclude = ["tests/*.img"]
keywords = ["btrfs", "filesystem", "dual-boot", "windows", "cli"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
crc32c = "0.6"
filetime = "0.2"
flate2 = "1"
globset = "0.4"
lzokay-native = "0.1"
# Checks the helper service's updates (src/helper/update.rs); no dependencies of its own.
minisign-verify = "0.3.0"
ruzstd = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

# The helper service and its named pipe (src/helper/windows.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
